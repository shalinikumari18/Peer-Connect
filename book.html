<section>
<div class="wrap">
<h2>Request a Session</h2>
<p class="sub">Tell the tutor what you need help with</p>
<form>
<label for="bName">Your Name</label>
<input type="text" id="bName" placeholder="Enter your name">
<label for="bTutor">Tutor</label>
<select id="bTutor"><option>Aman Sharma (Python)</option><option>Simran Kaur (Mathematics)</option><option>Neha Verma (Physics)</option><option>Rohit Singh (Python)</option><option>Karan Gill (Mathematics)</option><option>Pooja Mehra (Communication)</option></select>
<label for="bDate">Date</label>
<input type="date" id="bDate">
<label for="bTime">Time</label>
<input type="time" id="bTime">
<label>Session Mode</label>
<div><input type="radio" name="mode" id="online" checked> Online &nbsp; <input type="radio" name="mode" id="offline"> Offline</div>
<label for="bText">What do you need help with?</label>
<textarea id="bText" rows="4" placeholder="Describe the topic or difficulty"></textarea>
<button type="button" onclick="submitBooking()">Send Request</button>
<p class="msg" id="bookMsg"></p>
</form>
</div>
